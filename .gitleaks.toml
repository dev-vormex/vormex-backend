title = "Vormex Backend Gitleaks Config"

[extend]
useDefault = true

[allowlist]
description = "Repository-specific false positives"
paths = [
  '''(^|/)\.env$''',
  '''package-lock\.json$''',
  '''dist/''',
  '''node_modules/''',
]

regexes = [
  '''__REPLACE_ME__''',
  '''__REPLACE_WITH_64_HEX_CHARS__''',
  '''__EXAMPLE_[A-Z0-9_]+__''',
  '''your-[a-z0-9-]+''',
  '''replace-with-[a-z0-9-]+''',
  '''linkedinUrl''',
  '''githubProfileUrl''',
]

[[rules]]
id = "generic-api-key"

  [[rules.allowlists]]
  description = "Public OpenAI Apps domain-verification challenge"
  condition = "AND"
  regexTarget = "line"
  regexes = ['''OPENAI_APPS_CHALLENGE_TOKEN''']
  paths = ['''^src/mcp/public-discovery\.mcp\.ts$''']
