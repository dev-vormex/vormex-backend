# NOTE: region must match the database region. The Neon Postgres instance is in
# ap-southeast-1 (Singapore); running the API elsewhere adds ~150ms+ per query.
# Render cannot change the region of an existing service — if these services
# were created before this field existed, they must be recreated (or moved via
# dashboard) for it to take effect.
services:
  - type: web
    runtime: node
    name: vormex-backend
    plan: starter
    region: singapore
    buildCommand: npm ci --include=dev && npm run build
    preDeployCommand: npm run migrate:deploy
    startCommand: npm start
    healthCheckPath: /api/health/ready
    envVars:
      - key: NODE_ENV
        value: production
      # Explicitly initialize remote Upstash clients on API startup.
      - key: API_REDIS_MODE
        value: "true"
      # Required production secrets/URLs are entered in Render, never committed.
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: AUTH_CSRF_SECRET
        sync: false
      - key: ENCRYPTION_KEY
        sync: false
      - key: GITHUB_CLIENT_ID
        sync: false
      - key: GITHUB_CLIENT_SECRET
        sync: false
      - key: GITHUB_CALLBACK_URL
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: AUTH_REQUIRE_SESSION_ID
        value: "true"
      - key: SOCKET_TICKET_TTL_SECONDS
        value: "90"
      - key: RATE_LIMIT_AUTH_API_IP_PER_MINUTE
        value: "1200"
      - key: RATE_LIMIT_AUTH_API_IP_PER_HOUR
        value: "20000"
      - key: RATE_LIMIT_AUTH_API_FINGERPRINT_PER_MINUTE
        value: "600"
      # Legacy fallback during migration. Remove after both role URLs are set.
      - key: REDIS_URL
        sync: false
      # Critical: persistent/noeviction; queues, sessions, realtime, heartbeats.
      - key: CRITICAL_REDIS_URL
        sync: false
      # Cache: isolated and evictable; response/feed caches only.
      - key: CACHE_REDIS_URL
        sync: false
      - key: CRITICAL_REDIS_REQUIRED
        value: "true"
      - key: CACHE_REDIS_REQUIRED
        value: "true"
      - key: CACHE_MEMORY_MAX_ENTRIES
        value: "1000"
      - key: BACKGROUND_PROCESSES_REQUIRED
        value: "true"
      - key: PROXIMITY_REDIS_URL
        sync: false
      - key: FIREBASE_PROJECT_ID
        sync: false
      - key: FIREBASE_CLIENT_EMAIL
        sync: false
      - key: FIREBASE_PRIVATE_KEY
        sync: false
      - key: PROXIMITY_MARKER_HMAC_SECRET
        sync: false
      - key: PAGINATION_CURSOR_SECRET
        sync: false
      - key: CROSSED_PATHS_ENTRY_ENABLED
        value: "false"
      - key: CROSSED_PATHS_EVENT_MODE_ENABLED
        value: "false"
      - key: CROSSED_PATHS_PUBLIC_PRESENCE_ENABLED
        value: "false"
      - key: CROSSED_PATHS_LIVE_MAP_ENABLED
        value: "false"
      - key: CROSSED_PATHS_LIVE_LIST_ENABLED
        value: "false"
      - key: CROSSED_PATHS_ACCUMULATION_ENABLED
        value: "false"
      - key: CROSSED_PATHS_SUMMARY_NOTIFICATIONS_ENABLED
        value: "false"
      - key: CROSSED_PATHS_PERSISTENCE_ENABLED
        value: "false"
      - key: PROXIMITY_ROLLOUT_PERCENT
        value: "0"
  # These background processes must use the same secret env vars as the web service
  # (DATABASE_URL, REDIS_URL, Firebase creds, etc.) for re-engagement notifications to run.
  - type: worker
    runtime: node
    name: vormex-backend-worker
    plan: starter
    region: singapore
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm run start:worker
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: CRITICAL_REDIS_URL
        sync: false
      - key: CACHE_REDIS_URL
        sync: false
      - key: CRITICAL_REDIS_REQUIRED
        value: "true"
      - key: CACHE_REDIS_REQUIRED
        value: "true"
      - key: AUTH_REQUIRE_SESSION_ID
        value: "true"
      - key: WORKER_CONCURRENCY
        value: "1"
      - key: WORKER_ERROR_LOG_THROTTLE_MS
        value: "30000"
      # Keep the historical outbox untouched while worker health is verified.
      - key: OUTBOX_DISPATCH_ENABLED
        value: "false"
      - key: OUTBOX_DISPATCH_BATCH_SIZE
        value: "5"
  - type: worker
    runtime: node
    name: vormex-backend-scheduler
    plan: starter
    region: singapore
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm run start:scheduler
    envVars:
      - key: NODE_ENV
        value: production
      - key: REDIS_URL
        sync: false
      - key: CRITICAL_REDIS_URL
        sync: false
      - key: CRITICAL_REDIS_REQUIRED
        value: "true"
      - key: AUTH_REQUIRE_SESSION_ID
        value: "true"
      - key: OUTBOX_DISPATCH_ENABLED
        value: "false"
      - key: OUTBOX_DISPATCH_INTERVAL_MS
        value: "30000"
  - type: worker
    runtime: node
    name: vormex-proximity-worker
    plan: starter
    region: singapore
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm run start:proximity-worker
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: PROXIMITY_REDIS_URL
        sync: false
      - key: FIREBASE_PROJECT_ID
        sync: false
      - key: FIREBASE_CLIENT_EMAIL
        sync: false
      - key: FIREBASE_PRIVATE_KEY
        sync: false
      - key: CROSSED_PATHS_ACCUMULATION_ENABLED
        value: "false"
      - key: CROSSED_PATHS_SUMMARY_NOTIFICATIONS_ENABLED
        value: "false"
      - key: CROSSED_PATHS_PERSISTENCE_ENABLED
        value: "false"
      - key: PROXIMITY_ACCUMULATION_CONCURRENCY
        value: "8"
      - key: PROXIMITY_PERSISTENCE_CONCURRENCY
        value: "2"
      - key: PROXIMITY_QUEUE_HIGH_WATER
        value: "20000"
      - key: PROXIMITY_PERSISTENCE_QUEUE_HIGH_WATER
        value: "5000"
  - type: worker
    runtime: node
    name: vormex-proximity-scheduler
    plan: starter
    region: singapore
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm run start:proximity-scheduler
    envVars:
      - key: NODE_ENV
        value: production
      - key: PROXIMITY_REDIS_URL
        sync: false
