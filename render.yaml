services:
  - type: web
    runtime: node
    name: vormex-backend
    plan: starter
    buildCommand: npm ci --include=dev && npm run build
    preDeployCommand: npm run migrate:deploy
    startCommand: npm start
    healthCheckPath: /api/health/ready
    envVars:
      - key: NODE_ENV
        value: production
      - key: AUTH_REQUIRE_SESSION_ID
        value: "true"
  # These background processes must use the same secret env vars as the web service
  # (DATABASE_URL, REDIS_URL, Firebase creds, etc.) for re-engagement notifications to run.
  - type: worker
    runtime: node
    name: vormex-backend-worker
    plan: starter
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm run start:worker
    envVars:
      - key: NODE_ENV
        value: production
      - key: AUTH_REQUIRE_SESSION_ID
        value: "true"
      - key: WORKER_CONCURRENCY
        value: "1"
      - key: WORKER_ERROR_LOG_THROTTLE_MS
        value: "30000"
  - type: worker
    runtime: node
    name: vormex-backend-scheduler
    plan: starter
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm run start:scheduler
    envVars:
      - key: NODE_ENV
        value: production
      - key: AUTH_REQUIRE_SESSION_ID
        value: "true"
      - key: OUTBOX_DISPATCH_INTERVAL_MS
        value: "5000"
