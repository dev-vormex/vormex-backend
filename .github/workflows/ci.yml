name: Backend CI

on:
  pull_request:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/vormex
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/vormex
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 20.20.2
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run verify
      - run: npm run test:backend:compiled
