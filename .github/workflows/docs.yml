name: API Documentation Validation

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'src/openapi.yaml'
      - 'src/routes/**'
      - 'src/controllers/**'

permissions:
  contents: read
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'src/openapi.yaml'
      - 'src/routes/**'
      - 'src/controllers/**'

jobs:
  validate-openapi:
    name: Validate OpenAPI Specification
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      
      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20.20.2
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Install Swagger CLI
        run: npm install -g @apidevtools/swagger-cli
      
      - name: Validate OpenAPI spec
        run: swagger-cli validate src/openapi.yaml
      
      - name: Generate OpenAPI JSON
        run: swagger-cli bundle -o src/openapi.json src/openapi.yaml
      
      - name: Check for OpenAPI JSON
        run: |
          if [ ! -f src/openapi.json ]; then
            echo "Error: OpenAPI JSON generation failed"
            exit 1
          fi
          echo "OpenAPI JSON generated successfully"
      
      - name: Upload OpenAPI artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: openapi-spec
          path: src/openapi.json
          retention-days: 30
